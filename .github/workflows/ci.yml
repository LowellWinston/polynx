name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .

      - name: Run test suite
        env:
          PYTHONPATH: src
        run: |
          pytest tests/ -v

  min-polars:
    name: Test (minimum supported Polars)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies (Polars pinned to the declared floor)
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .
          # keep in sync with `polars>=` in pyproject.toml and setup.py
          pip install "polars==1.8.0"

      - name: Run test suite
        env:
          PYTHONPATH: src
        run: |
          pytest tests/ -v
